name: postbox
description: PostBox - an open-source, local-first HTTP API client by Uniqueone.
publish_to: none
version: 1.0.0+5

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.0
  shared_preferences: ^2.5.0
  # Native SQLite through build hooks (no sqlite3_flutter_libs needed in 3.x).
  sqlite3: ^3.1.0
  path_provider: ^2.1.5
  path: ^1.9.0
  # Linux needs libsecret and a keyring service; see docs/SECURITY.md.
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.0
  crypto: ^3.0.6
  app_links: ^6.4.0
  # Native open/save dialogs and file choosers (Android, Windows, Linux, macOS).
  file_picker: ^10.1.0
  # Drag-and-drop of files onto the window (Windows, Linux, macOS, Android).
  desktop_drop: ^0.5.0
  # Pure-Dart HTTP/2 transport (ALPN "h2" over dart:io SecureSocket).
  http2: ^2.3.0
  # Renders HTML/CSS in the response preview. Pure Dart, no JavaScript engine.
  flutter_widget_from_html_core: '>=0.15.0 <1.0.0'

dev_dependencies:
  # Run once after pubspec changes: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1
  # Run once: dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/logo.png
    - assets/branding/logo_256.png
  # Bundled fonts (all SIL OFL 1.1, licences next to the files).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
    - family: PostBoxDigits
      fonts:
        - asset: assets/fonts/PostBoxDigits-Regular.ttf
        - asset: assets/fonts/PostBoxDigits-Medium.ttf
          weight: 500
        - asset: assets/fonts/PostBoxDigits-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PostBoxDigits-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

# Generates the launcher icons from the PostBox logo (Android adaptive icon,
# Windows .ico). Linux and the installers use the files in assets/branding.
flutter_launcher_icons:
  image_path: assets/branding/logo.png
  android: true
  ios: false
  adaptive_icon_background: assets/branding/logo_background.png
  adaptive_icon_foreground: assets/branding/logo_foreground.png
  windows:
    generate: true
    image_path: assets/branding/logo.png
    icon_size: 256

# Native splash shown before Flutter starts (Android). Windows and Linux show
# the in-app splash screen (lib/ui/splash/splash_screen.dart) instead.
flutter_native_splash:
  color: "#16130F"
  image: assets/branding/logo_512.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#16130F"
    image: assets/branding/logo_foreground.png
    icon_background_color: "#F4503E"
