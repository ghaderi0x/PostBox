name: postbox
description: PostBox - an open-source, local-first HTTP API client by Uniqueone.
publish_to: none
version: 0.3.0+3

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.0
  shared_preferences: ^2.5.0
  # Native SQLite through build hooks (no sqlite3_flutter_libs needed in 3.x).
  sqlite3: ^3.1.0
  path_provider: ^2.1.5
  path: ^1.9.0
  # Linux needs libsecret and a keyring service; see docs/SECURITY.md.
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.0
  crypto: ^3.0.6
  app_links: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Fonts are not bundled in the repository. Download Vazirmatn, Inter and
  # JetBrains Mono (all SIL OFL 1.1), put the files in assets/fonts/ (see
  # assets/fonts/README.md), then uncomment this block. Declaring fonts whose
  # files are missing breaks the build, so it stays commented until then.
  #
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #   - family: Vazirmatn
  #     fonts:
  #       - asset: assets/fonts/Vazirmatn-Regular.ttf
  #       - asset: assets/fonts/Vazirmatn-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Vazirmatn-SemiBold.ttf
  #         weight: 600
  #   - family: JetBrainsMono
  #     fonts:
  #       - asset: assets/fonts/JetBrainsMono-Regular.ttf
  #       - asset: assets/fonts/JetBrainsMono-Bold.ttf
  #         weight: 700
